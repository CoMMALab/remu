[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remu"
version = "0.1.0"
description = "MuJoCo-backed emulator for the Franka FCI (libfranka) network protocol."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "h5py>=3.10",
    "mcap>=1.2,<2",
    "mcap-protobuf-support>=0.5,<1",
    "Pillow>=10",
    "protobuf>=6.33.5,<7",
    "robot_descriptions>=1.12",
]

[project.optional-dependencies]
viser = ["mjviser", "viser"]
dev = ["pytest", "pytest-timeout"]

[project.scripts]
remu = "remu.cli:main"
remu-export-hdf5 = "remu.hdf5:main"
remu-export-fr3-teleop = "remu.fr3_teleop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remu = ["models/*.urdf", "models/*.c", "models/*.so", "proto/*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
