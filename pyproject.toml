[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remu"
version = "0.1.0"
description = "MuJoCo-backed emulator for the Franka FCI (libfranka) network protocol."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "robot_descriptions>=1.12",
]

[project.optional-dependencies]
viser = ["mjviser", "viser"]
dev = ["pytest", "pytest-timeout"]
yam = ["mujoco>=3.3.5", "portal==3.7.3"]

[project.scripts]
remu = "remu.cli:main"
remu-yam = "remu.yam.cli:main"
remu-yam-world = "remu.yam.world_cli:main"
remu-yam-bimanual = "remu.yam.bimanual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remu = ["models/*.urdf", "models/*.c", "models/yam/*", "models/yam/assets/*.stl", "models/yam/objects/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
