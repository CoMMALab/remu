syntax = "proto3";

package remu.recording.v1;

message SimState {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  repeated double qpos = 3;
  repeated double qvel = 4;
}

message FciCommand {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  string mode = 3;
  repeated double q_command = 4;
  repeated double dq_command = 5;
  repeated double tau_command = 6;
  bool motion_finished = 7;
  uint64 message_id = 8;
}

message FciState {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  repeated double q = 3;
  repeated double dq = 4;
  repeated double q_d = 5;
  repeated double dq_d = 6;
  repeated double ddq_d = 7;
  repeated double tau_j = 8;
}

message GripperCommand {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  string command = 3;
  double width = 4;
  double speed = 5;
  double force = 6;
  double epsilon_inner = 7;
  double epsilon_outer = 8;
  uint64 command_id = 9;
}

message GripperState {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  double width = 3;
  double max_width = 4;
  bool is_grasped = 5;
  repeated double q = 6;
  repeated double dq = 7;
}

message CameraFrame {
  string camera_name = 1;
  uint64 frame_index = 2;
  uint64 trajectory_tick_index = 3;
  int64 scheduled_sim_time_ns = 4;
  int64 actual_sim_time_ns = 5;
  string encoding = 6;
  uint32 width = 7;
  uint32 height = 8;
  double depth_scale = 9;
  bytes data = 10;
}

message Event {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  string type = 3;
  string message = 4;
  map<string, string> details = 5;
}

message RawPacket {
  uint64 tick_index = 1;
  int64 sim_time_ns = 2;
  string transport = 3;
  string direction = 4;
  string endpoint = 5;
  bytes data = 6;
}
